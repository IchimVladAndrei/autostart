server:
  port: 8083

spring:
  application:
    name: sales-service
  profiles:
    active: dev
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    discovery:
      client:
        simple:
          instances:
            auth-user-service:
              - uri: http://localhost:8081
              - uri: http://localhost:8181
            vehicle-service:
              - uri: http://localhost:8082
              - uri: http://localhost:8182
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/autostart}
    driverClassName: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  internal:
    token: ${INTERNAL_SERVICE_TOKEN}
  services:
    auth-user-url: ${AUTH_USER_INTERNAL_URL:http://auth-user-service}
    vehicle-url: ${VEHICLE_INTERNAL_URL:http://vehicle-service}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    remember-me-refresh-expiration-ms: ${JWT_REMEMBER_ME_REFRESH_EXPIRATION_MS:2592000000}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
