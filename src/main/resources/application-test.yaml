spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;INIT=CREATE SCHEMA IF NOT EXISTS auth_user\;CREATE SCHEMA IF NOT EXISTS vehicle\;CREATE SCHEMA IF NOT EXISTS sales
    driverClassName: org.h2.Driver
    username: tester
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  h2:
    console:
      enabled: true

logging:
  level:
    com.autodrive.backend: INFO
    org.springframework: WARN
    org.hibernate: WARN

app:
  jwt:
    secret: autostart-h2-test-jwt-signing-key-2026-minimum-32-chars
    expiration-ms: 3600000
    refresh-expiration-ms: 604800000
    remember-me-refresh-expiration-ms: 2592000000
