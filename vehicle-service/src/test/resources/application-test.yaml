server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:vehicledb;INIT=CREATE SCHEMA IF NOT EXISTS vehicle
    driverClassName: org.h2.Driver
    username: tester
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  internal:
    token: test-internal-token
  jwt:
    secret: autostart-vehicle-test-jwt-signing-key-2026-minimum-32-chars
    expiration-ms: 3600000
    refresh-expiration-ms: 604800000
    remember-me-refresh-expiration-ms: 2592000000
