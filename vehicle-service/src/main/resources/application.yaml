server:
  port: 8082

spring:
  application:
    name: vehicle-service
  profiles:
    active: dev
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/autostart}
    driverClassName: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  internal:
    token: ${INTERNAL_SERVICE_TOKEN}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    remember-me-refresh-expiration-ms: ${JWT_REMEMBER_ME_REFRESH_EXPIRATION_MS:2592000000}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always