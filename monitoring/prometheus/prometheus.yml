global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8081  # AuthUser
          - host.docker.internal:8082  # Vehicle
          - host.docker.internal:8083  # Sales