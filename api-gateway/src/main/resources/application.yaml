spring:
  application:
    name: api-gateway
  profiles:
    active: dev

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  routes:
    auth-user-url: ${AUTH_USER_ROUTE_URL:http://auth-user-service}
    vehicle-url: ${VEHICLE_ROUTE_URL:http://vehicle-service}
    sales-url: ${SALES_ROUTE_URL:http://sales-service}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    instance-id: ${app.instance-id:${spring.application.name}:${random.uuid}}
    prefer-ip-address: true
