server:
  port: 8080

spring:
  application:
    name:  api-gateway

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  routes:
    auth-user-url: ${AUTH_USER_SERVICE_URL:lb://auth-user-service}
    vehicle-url: ${VEHICLE_SERVICE_URL:lb://vehicle-service}
    sales-url: ${SALES_SERVICE_URL:lb://sales-service}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true